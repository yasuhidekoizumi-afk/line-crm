<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グラノーラバー配信HTMLをコピー | ORYZAE</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 20px; background: #f3f1eb; color: #28251f; font-family: 'Yu Gothic', YuGothic, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; }
      [role="main"] { width: 100%; max-width: 640px; margin: 0 auto; padding: 44px 38px; background: #fff; border-top: 5px solid #c8a968; }
      .eyebrow { margin: 0; font-size: 12px; font-weight: bold; letter-spacing: .12em; color: #a57d32; }
      h1 { margin: 12px 0 0; font-size: 28px; font-weight: normal; line-height: 1.45; color: #8a6828; }
      p { font-size: 15px; line-height: 1.9; color: #514e47; }
      .copy-button { display: block; width: 100%; margin-top: 28px; padding: 18px 20px; border: 0; border-radius: 0; background: #8a6828; color: #fff; cursor: pointer; font: inherit; font-size: 16px; font-weight: bold; }
      .copy-button:hover, .copy-button:focus-visible { background: #71531f; }
      .status { min-height: 1.8em; margin: 16px 0 0; text-align: center; font-size: 14px; color: #725c37; }
      .source-link { display: inline-block; margin-top: 16px; color: #8a6828; font-size: 14px; text-decoration: underline; }
      iframe { position: absolute; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; }
      @media screen and (max-width: 620px) { body { padding: 16px; } [role="main"] { padding: 34px 24px; } h1 { font-size: 24px; } }
    </style>
  </head>
  <body>
    <div role="main">
      <p class="eyebrow">ORYZAE MAIL</p>
      <h1>グラノーラバー配信HTML</h1>
      <p>下のボタンを押すと、Shopify Messagingへ貼り付けるためのメールHTML全体をコピーします。</p>
      <button id="copy-button" class="copy-button" type="button">HTMLをコピー</button>
      <p id="status" class="status" aria-live="polite">コピーの準備ができました。</p>
      <a class="source-link" href="./ORYZAE_EMAIL_GRANOLA_BAR_2026-07-17.html" target="_blank">配信内容を別タブで確認する</a>
    </div>

    <!-- file:// でも動くよう、同じフォルダのHTMLをiframeにも読み込んでいる。 -->
    <iframe id="email-source" src="./ORYZAE_EMAIL_GRANOLA_BAR_2026-07-17.html" title="メールHTMLの読み込み"></iframe>

    <script>
      const sourcePath = './ORYZAE_EMAIL_GRANOLA_BAR_2026-07-17.html';
      const copyButton = document.getElementById('copy-button');
      const status = document.getElementById('status');
      const emailSource = document.getElementById('email-source');

      // HTTPS配信時は元ファイルを文字列のまま取得する。
      async function loadHtml() {
        try {
          const response = await fetch(sourcePath);
          if (!response.ok) throw new Error('HTMLを読み込めませんでした。');
          return await response.text();
        } catch (error) {
          // ローカルファイルでfetchが制限された場合は、iframeからHTMLを取得する。
          const documentElement = emailSource.contentDocument && emailSource.contentDocument.documentElement;
          if (!documentElement) throw error;
          return '<!doctype html>\n' + documentElement.outerHTML;
        }
      }

      // Clipboard APIが使えない環境でもコピーできるよう、従来方式を残す。
      function legacyCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.remove();
        if (!copied) throw new Error('コピーに失敗しました。');
      }

      copyButton.addEventListener('click', async () => {
        copyButton.disabled = true;
        copyButton.textContent = 'コピーしています…';
        status.textContent = '';

        try {
          const html = await loadHtml();
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(html);
          } else {
            legacyCopy(html);
          }
          copyButton.textContent = 'HTMLをコピーしました';
          status.textContent = 'Shopify MessagingのHTML編集画面で、そのまま貼り付けてください。';
        } catch (error) {
          copyButton.textContent = 'HTMLをコピー';
          status.textContent = 'コピーできませんでした。配信内容を別タブで開き、ページのソースをコピーしてください。';
        } finally {
          copyButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
