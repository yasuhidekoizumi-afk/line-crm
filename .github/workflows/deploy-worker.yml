name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - '.github/workflows/deploy-worker.yml'

# 同じ本番Workerへのデプロイが重なった場合、古い実行を先に完了させてから進める。
concurrency:
  group: deploy-production-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # 本番WorkerはGitHubのmainからだけデプロイする。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify production source
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Debug info
        run: |
          node --version
          pnpm --version
          which node

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db build

      - name: Worker build with log capture
        run: |
          pnpm --filter worker build 2>&1 | tee /tmp/worker-build-log.txt
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - run: |
          echo "=== BUILD LOG ==="
          cat /tmp/worker-build-log.txt
          echo "=== END BUILD LOG ==="
          if grep -i 'error' /tmp/worker-build-log.txt; then
            echo "FOUND ERRORS:"
            grep -i 'error' /tmp/worker-build-log.txt
            exit 1
          fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          # wrangler.tomlの既定名はローカル安全用。本番名はmainのCIだけが指定する。
          command: deploy --name oryzae-line-crm --message "GitHub main ${{ github.sha }}"
